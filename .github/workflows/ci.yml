name: FleetFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - vehicle-service
          - driver-service
          - booking-service
          - trip-service
          - maintenance-service
          - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: application/${{ matrix.service }}
        run: npm install
      - name: Run unit tests (if any)
        working-directory: application/${{ matrix.service }}
        run: npm test --if-present

  api-regression:
    runs-on: ubuntu-latest
    needs: install-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Start stack
        run: docker compose -f docker/docker-compose.yml up -d --build
      - name: Wait for services
        run: sleep 15
      - name: REST Assured suite
        working-directory: automation/rest-assured
        run: mvn -B test
      - name: Cucumber suite
        working-directory: automation/cucumber
        run: mvn -B test
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  ui-smoke:
    runs-on: ubuntu-latest
    needs: install-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start stack
        run: docker compose -f docker/docker-compose.yml up -d --build
      - name: Wait for services
        run: sleep 15
      - name: Install Playwright
        working-directory: automation/playwright-js
        run: npm install && npx playwright install --with-deps
      - name: Run Playwright smoke tests
        working-directory: automation/playwright-js
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: automation/playwright-js/playwright-report
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
